<!doctype html>
<html lang="en" data-booting>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Choose a profile · Streak.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>

<body class="picker">
  <div class="picker__inner">
    <header class="picker__head">
      <span class="wordmark"><b>Streak</b><i>.</i></span>
      <h1>Who’s using Streak.?</h1>
      <p>Pick a profile. Everything you log goes to that one.</p>
    </header>

    <div class="profile-grid" id="grid" aria-busy="true">
      <div class="skeleton skeleton--card"></div>
      <div class="skeleton skeleton--card"></div>
    </div>

    <footer class="picker__foot">
      <span class="faint" id="signed-in-as"></span>
      <button class="btn btn--ghost btn--sm" type="button" id="theme-toggle">
        Switch theme
      </button>
      <button class="btn btn--ghost btn--sm" type="button" id="sign-out">Sign out</button>
    </footer>
  </div>

  <dialog class="modal" id="add-modal" aria-labelledby="add-title">
    <form method="dialog" id="add-form">
      <div class="modal__head">
        <h2 class="modal__title" id="add-title">Add a profile</h2>
        <button class="btn btn--icon" type="button" value="cancel" id="add-close" aria-label="Close">×</button>
      </div>

      <div class="modal__body stack">
        <p class="banner banner--error" id="add-error" role="alert" hidden></p>

        <div class="field">
          <label class="label" for="profile-name">Name</label>
          <input class="input" id="profile-name" name="name" maxlength="40" required autocomplete="off" />
        </div>

        <div class="field">
          <span class="label" id="colour-label">Colour</span>
          <div class="swatches" role="group" aria-labelledby="colour-label" id="swatches"></div>
        </div>
      </div>

      <div class="modal__foot">
        <button class="btn btn--secondary" type="button" id="add-cancel">Cancel</button>
        <button class="btn btn--primary" type="submit" id="add-submit">Add profile</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { requireSession, signOut, getUser, goTo, DEFAULT_PAGE } from './js/auth.js';
    import { listProfiles, createProfile, setActiveProfile } from './js/profiles.js';
    import {
      el, clear, toast, initials, emptyState, setBusy, showBanner,
      setTheme, effectiveTheme,
    } from './js/ui.js';

    await requireSession();

    const grid = document.getElementById('grid');
    const modal = document.getElementById('add-modal');
    const addForm = document.getElementById('add-form');
    const addError = document.getElementById('add-error');
    const addSubmit = document.getElementById('add-submit');
    const nameInput = document.getElementById('profile-name');
    const swatches = document.getElementById('swatches');

    /* Avatar colours live in tokens.css; JS reads them rather than repeating
       the hex values, so the palette has exactly one home. */
    const styles = getComputedStyle(document.documentElement);
    const PALETTE = Array.from({ length: 8 }, (_, i) =>
      styles.getPropertyValue(`--avatar-${i + 1}`).trim(),
    ).filter(Boolean);
    let chosenColour = PALETTE[0];

    getUser().then((user) => {
      if (user) document.getElementById('signed-in-as').textContent = user.email;
    });

    /* ------------------------------------------------------------ render -- */

    function profileCard(profile) {
      return el('button', {
        class: 'profile-card',
        type: 'button',
        onclick: () => choose(profile),
      }, [
        el('span', {
          class: 'avatar avatar--xl',
          style: `--avatar: ${profile.avatar_color}`,
          'aria-hidden': 'true',
          text: initials(profile.name),
        }),
        el('span', { class: 'profile-card__name', text: profile.name }),
      ]);
    }

    function addCard() {
      return el('button', {
        class: 'profile-card profile-card--add',
        type: 'button',
        onclick: openAddModal,
      }, [
        el('span', { class: 'avatar avatar--xl', 'aria-hidden': 'true', text: '+' }),
        el('span', { class: 'profile-card__name', text: 'Add profile' }),
      ]);
    }

    async function render() {
      grid.setAttribute('aria-busy', 'true');
      try {
        const profiles = await listProfiles();
        clear(grid);

        if (!profiles.length) {
          grid.classList.add('profile-grid--empty');
          grid.append(
            emptyState({
              title: 'No profiles yet',
              body: 'A profile holds one person’s habits, finances and trades. Make the first one.',
              actionLabel: 'Add a profile',
              onAction: openAddModal,
            }),
          );
        } else {
          grid.classList.remove('profile-grid--empty');
          for (const profile of profiles) grid.append(profileCard(profile));
          grid.append(addCard());
        }
      } catch (error) {
        clear(grid).append(
          emptyState({
            title: 'Couldn’t load your profiles',
            body: error.message,
            actionLabel: 'Try again',
            onAction: render,
          }),
        );
      } finally {
        grid.setAttribute('aria-busy', 'false');
      }
    }

    /* ------------------------------------------------------------ choose -- */

    function choose(profile) {
      setActiveProfile(profile);
      goTo(DEFAULT_PAGE);
    }

    /* --------------------------------------------------------- add modal -- */

    function renderSwatches() {
      clear(swatches);
      for (const colour of PALETTE) {
        swatches.append(
          el('button', {
            class: 'swatch',
            type: 'button',
            style: `background-color: ${colour}`,
            'aria-label': `Colour ${colour}`,
            'aria-pressed': String(colour === chosenColour),
            onclick: () => {
              chosenColour = colour;
              renderSwatches();
            },
          }),
        );
      }
    }

    function openAddModal() {
      addForm.reset();
      showBanner(addError, null);
      chosenColour = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      renderSwatches();
      modal.showModal();
      nameInput.focus();
    }

    document.getElementById('add-cancel').addEventListener('click', () => modal.close());
    document.getElementById('add-close').addEventListener('click', () => modal.close());

    addForm.addEventListener('submit', async (event) => {
      // The dialog would close on submit; we close it ourselves once it saves.
      event.preventDefault();
      showBanner(addError, null);

      const name = nameInput.value.trim();
      if (!name) {
        showBanner(addError, 'Give the profile a name.');
        nameInput.focus();
        return;
      }

      setBusy(addSubmit, true, 'Adding…');
      try {
        await createProfile({ name, avatarColor: chosenColour });
        modal.close();
        toast(`${name} added.`, { type: 'success' });
        await render();
      } catch (error) {
        showBanner(addError, error.message);
      } finally {
        setBusy(addSubmit, false);
      }
    });

    /* ------------------------------------------------------------ footer -- */

    document.getElementById('sign-out').addEventListener('click', signOut);

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      setTheme(next);
      toast(`${next === 'dark' ? 'Dark' : 'Light'} theme on.`, { type: 'info', duration: 2000 });
    });

    render();
  </script>
</body>
</html>
